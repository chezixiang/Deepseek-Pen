[package]
name = "ds-free-api"
version = "0.2.11"
license = "GPL-3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = "0.22.1"
aes = "0.8"
bcrypt = "0.19"
bytes = "1"
chrono = "0.4.44"
dashmap = "6"
flate2 = "1"
env_logger = { version = "0.11.10", features = ["auto-color"] }
futures = "0.3.32"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["png"] }
if-addrs = "0.13"
log = "0.4.29"
md-5 = "0.11"
mime_guess = "2.0.5"
pin-project-lite = "0.2.17"
qrcode = { version = "0.14", features = ["image"] }
rsa = "0.9"
rand = "0.10.0"
rand_chacha = "0.3"
rand_core = "0.6"
wreq = { version = "5.3.0", default-features = false, features = ["json", "stream", "multipart", "socks", "cookies", "webpki-roots"] }
wreq-util = "2.2.6"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.11.0"
sm_des = { path = "../CAPTCHA" }
thiserror = "2.0.18"
tiktoken-rs = "0.11.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.1.2"
tower-http = { version = "0.6", features = ["fs", "cors"] }
wasmtime = { version = "48", features = ["cranelift"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
