[server]
host = "127.0.0.1"
port = 22217

# CORS 允许的 Origin 列表（默认 ["http://localhost:22217"]）
# 设为 ["*"] 允许所有 Origin（不推荐生产使用）
# cors_origins = ["http://localhost:22217"]

# API Key 和管理密码通过 Web 管理面板配置（http://127.0.0.1:22217/admin）
# 首次访问时将引导设置管理密码，之后可在面板中创建/管理 API Key
# Admin 配置（由管理面板自动管理，部署时无需手动填写）
# [admin]
# password_hash = ""
# jwt_secret = ""
# jwt_issued_at = 0

# API Key 列表（由管理面板自动管理，部署时无需手动填写）
# [[api_keys]]
# key = "sk-xxx"
# description = "My API Key"

# 邮箱登录示例
# device_id（可选）：数美（Shumei）浏览器设备指纹。
# - 登录请求体里的 device_id 字段；实测**不可伪造**，伪造值会被
#   RISK_DEVICE_DETECTED（biz_code 11）拒绝。留空时自动生成随机 UUID 兜底，
#   若登录被 11 号错误拒绝，请按下面步骤抓取真实值填入。
# - 强烈建议每个账号用独立的 device_id（设备级指纹被上游用于关联画像，
#   共用会显著提升连坐禁言风险）。
# - 抓取步骤：Chrome 打开 https://chat.deepseek.com/sign_in 登录一次 →
#   开发者工具 → Network → 过滤 users/login → 复制 Payload 里的 device_id。
#   简化方案：控制台执行 SMSdk.getDeviceId()（等 SMSdk 就绪）。
# device_id = "从浏览器抓到的值"
# smid（可选，配合 device_id）：数美 smidV2 Cookie 值。抓包实证登录请求同时携带
# body 里的 device_id 和 Cookie 里的 smidV2（同一设备身份的两半），只发 device_id
# 与真实浏览器不符。抓取：同一浏览器 DevTools → Application → Cookies →
# chat.deepseek.com → 复制 smidV2。同设备多账号填同一个值。留空 = 不发送。
# smid = "从浏览器 Cookie 里抓到的值"
[[accounts]]
email = "user1@example.com"
mobile = ""
area_code = ""
password = "pass1"

# 中国手机号登录示例
[[accounts]]
email = ""
mobile = "13800138000"
area_code = "+86"
password = "pass2"

# 国际手机号登录示例
[[accounts]]
email = ""
mobile = "1234567890"
area_code = "+1"
password = "pass3"

[deepseek]
# 工具调用标签配置
# 内置模糊匹配：全角 `｜`(U+FF5C) 与 `▁`(U+2581) 分别等价于 ASCII `|` 和 `_`，
# 自动覆盖大多数字符级幻觉变体。
# extra 用于格式完全不同的回退标签（如 <tool_call>）：
# tool_call.extra_starts = ["<|tool_call_begin|>", "<tool_calls>", "<tool_call>"]
# tool_call.extra_ends = ["<|tool_call_end|>", "</tool_calls>", "</tool_call>"]

# User-Agent（默认 Linux aarch64 桌面 Chrome 136，与 TLS 指纹 Emulation::Chrome136
# 同大版本、与词典笔真实硬件平台一致；如需覆盖请保持 Chrome 大版本 = 136）
# user_agent = "Mozilla/5.0 (X11; Linux aarch64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"

# API 基础地址（默认）
# api_base = "https://chat.deepseek.com/api/v0"

# WASM 文件完整 URL（PoW 计算所需，版本号会变动，建议手动更新）
# wasm_url = "https://fe-static.deepseek.com/chat/static/sha3_wasm_bg.7b9ca65ddd.wasm"

# X-Client-Version 请求头（站点部署版本，默认 2.5.0，与浏览器版本无关）
# client_version = "2.5.0"

# X-Client-Platform 请求头（web 端固定 "web"）
# client_platform = "web"

# X-Client-Locale 请求头
# client_locale = "zh_CN"

# 支持的模型类型列表（官方 2026-09-12 已合并模型，只剩 "default"，
# 图片理解/深度思考/联网搜索都是 default 上的正交开关）
# model_types = ["default"]
# max_input_tokens = [1048576]
# max_output_tokens = [384000]

# 模型别名（可选，按 index 对齐 model_types，默认无别名）
# 如 model_types = ["default", "expert"], model_aliases = ["", "deepseek-v4-pro"]
# 则仅 deepseek-v4-pro → expert（index 1），空字符串被跳过
# model_aliases = []

# 每账号每小时请求上限（0 = 不限制，默认 60）
# 上游实测同一账号累计约 215 次/小时会被禁言（biz_code 5），且禁言是延迟判定的。
# 需要更高吞吐时请增加账号数量，而不是抬高这个值。
# hourly_request_quota = 60

# 未显式传入 web_search_options 时是否默认开启搜索模式（默认 true）
# 设为 false 则严格遵循 OpenAI 语义（未传即关闭），可减少 DeepSeek 侧的系统提示词注入。
# default_search_enabled = true

# 各模型类型的单次输入字符数限制（与 model_types 按索引一一对应，上游实测 2621440）
# input_character_limits = [2621440]

# x-hif-leim / x-hif-dliq 动态凭据：
# bundle 逆向证实这两个头不是本地 JS 生成，而是浏览器 poller 从 DeepSeek
# 分发服务（hif-leim/hif-dliq.deepseek.com/query）定期拉取的公开凭据
# （无鉴权，TTL 600s）。默认后台自动拉取并在 completion 上附加，与真实
# 浏览器行为一致，无需配置。以下三项一般无需改动：
# hif_auto_fetch = true   # 关闭后 completion 不带 HIF 头
# hif_leim = ""           # 静态覆盖（调试实验用，留空走动态值）
# hif_dliq = ""           # 静态覆盖（同上）

# 代理配置（可选，绕过 CloudFront WAF 地区限制）
# 使用非美国地区的代理出口节点可避免 WAF Challenge
# [proxy]
# url = "http://127.0.0.1:7890"
# url = "socks5://127.0.0.1:7891"
