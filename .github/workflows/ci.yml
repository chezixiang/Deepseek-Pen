name: CI

# 本仓库是三合一 monorepo（Rust 后端 + Web 管理面板 + 词典笔小程序），
# 三部分互相依赖，所以 CI 按依赖顺序串起来：
#
#   web ──┬─> backend ──> miniapp
#         └─（rust_embed 需要 web/dist 才能编译）
#
# 依赖链的两处硬约束（来自 docs/development.md 与 HOWTOBUILD.md）：
#   1. 后端 `#[folder = "web/dist/"]` 是编译期内嵌：没有 web/dist 就编不过，
#      所以 backend job 必须先拿到 web job 的产物。
#   2. 小程序 build:prod 会跑 scripts/inline-backend.js 把后端二进制转 base64 内嵌，
#      二进制不进 git（app/backend/* 被忽略），所以 miniapp job 必须先拿到
#      backend job 的 aarch64 二进制。
#
# 另外两处本仓库特有的坑，下面 job 里已绕开：
#   - ds-free-api/.cargo/config.toml（已被 git 跟踪）把默认 target 钉成 aarch64
#     （交叉编译），所以宿主单元测试必须显式 --target x86_64-unknown-linux-gnu
#     并覆盖 CC/CXX/AR；backend job 还额外设置了 aarch64 linker 环境变量兜底，
#     即使有人误删 cargo 配置，aarch64 产物路径也不会再跑偏。
#   - app/package.json 与 package-lock.json 里 @dictpen/* 写的是绝对路径
#     file:D:/codes/youdao/sdk/...（STRUCTURE_CHANGELOG 里明确「暂不修改」），
#     CI 在检出后按 SDK 的 new-app.sh 约定改写成相对路径，不动仓库里的文件。
#     package-lock.json 的 packages[""] 根条目必须与 package.json 一起改写，
#     否则旧版 npm（node 18 自带）的 npm ci 会报 lock 不同步。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 词典笔小程序 SDK（@dictpen/core + @dictpen/types）不在本仓库内，需单独检出。
  # 仓库是公开的；若改为私有，请换成带 token 的 checkout（见下方 miniapp job 注释）。
  SDK_REPO: chezixiang/YouDaoPen-SDK
  SDK_REF: main

jobs:
  # ---------------------------------------------------------------- Web 面板
  web:
    name: Web 管理面板（构建 + lint）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ds-free-api/web/.node-version
          cache: npm
          cache-dependency-path: ds-free-api/web/package-lock.json
      - name: 安装依赖
        working-directory: ds-free-api/web
        run: npm ci
      - name: 构建（tsc -b + vite build）
        working-directory: ds-free-api/web
        run: npm run build
      - name: lint
        working-directory: ds-free-api/web
        run: npm run lint
      - name: 上传前端产物（后端 rust_embed 编译期需要）
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ds-free-api/web/dist/
          if-no-files-found: error

  # ------------------------------------------------------------------ Rust
  backend:
    name: 后端（check + 单元测试 + aarch64 release）
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # aarch64 交叉工具链兜底：正常情况下 ds-free-api/.cargo/config.toml（已提交）
      # 提供同名配置；这里再显式声明一遍，保证 release 产物一定落在
      # target/aarch64-unknown-linux-gnu/release/ 供上传与 miniapp 内嵌。
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4

      - name: 下载前端产物到 web/dist（rust_embed 内嵌用）
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ds-free-api/web/dist

      - name: 安装 Rust 1.95.0（含 clippy 与 aarch64 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-unknown-linux-gnu
          components: clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            CAPTCHA -> target
            ds-free-api -> target

      # BoringSSL（wreq → boring-sys2 依赖）需要 cmake/g++/libclang/perl；
      # aarch64 交叉工具链供 .cargo/config.toml 里的 linker = aarch64-linux-gnu-gcc 使用。
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libclang-dev pkg-config perl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # 注：本 fork 的 CAPTCHA crate 未过 rustfmt，ds-free-api 亦如此，
      # 且存在 dead_code 警告，所以这里刻意不跑 `cargo fmt --check` /
      # `clippy -D warnings`（上游 justfile 的 `just check` 在本仓库会红）。
      - name: cargo check（默认 aarch64 交叉目标，含所有 target）
        working-directory: ds-free-api
        run: cargo check --all-targets

      # 宿主 target 单元测试：.cargo/config.toml 的 [build].target 与 [env] 都指向
      # aarch64 交叉编译，而 aarch64 测试二进制无法在 x86_64 上执行，
      # 故按仓库自带的 run-host-tests.sh 显式指定宿主 target 并覆盖 CC/CXX/AR、
      # 清空 [build].target。
      #
      # CAPTCHA 用完整 cargo test：tests/ 下的解密调试脚本已用 #[ignore] 标注
      # （decrypt_ip / decrypt_fields 需要 IP_B64 / FIELDS_JSON 环境变量才有意义），
      # verify_bc 的 des_roundtrip 已修复为真正的回归测试，会正常执行。
      - name: CAPTCHA 测试（宿主 target）
        working-directory: CAPTCHA
        run: |
          cargo test --target x86_64-unknown-linux-gnu \
            --config 'env.CC="gcc"' --config 'env.CXX="g++"' --config 'env.AR="ar"' \
            --config 'build.target=""'

      # --lib --tests：单元测试（src 内 #[cfg(test)]）+ 集成测试（tests/ 目录，
      # 路由层鉴权/错误映射 + SSE 全管线，均为离线测试，不访问真实上游）。
      - name: ds-free-api 测试（宿主 target）
        working-directory: ds-free-api
        run: |
          cargo test --lib --tests --target x86_64-unknown-linux-gnu \
            --config 'env.CC="gcc"' --config 'env.CXX="g++"' --config 'env.AR="ar"' \
            --config 'build.target=""'

      - name: 构建 aarch64 release（词典笔用）
        working-directory: ds-free-api
        run: cargo build --release --target aarch64-unknown-linux-gnu

      # 本地构建脚本还会用 upx 压缩，CI 产物保持未压缩，供 miniapp job 内嵌。
      - name: 上传后端二进制
        uses: actions/upload-artifact@v4
        with:
          name: ds-free-api-aarch64
          path: ds-free-api/target/aarch64-unknown-linux-gnu/release/ds-free-api
          if-no-files-found: error

  # ------------------------------------------------------- 词典笔小程序
  miniapp:
    name: 小程序（类型检查 + 打包 AMR）
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 小程序构建链路要求 Node 18（package.json engines: >=16 <23）
      NODE_VERSION: "18"
    steps:
      - uses: actions/checkout@v4

      # SDK 检出到「仓库的上一级」，即 $GITHUB_WORKSPACE/../sdk。
      # 原因：app/package-lock.json 里 @dictpen/* 的 resolved 是 ../../sdk/packages/*，
      # 只有让 sdk 与仓库目录同级，`file:../../sdk/...` 才能解析到。
      # 若 SDK 仓库改为私有，把这条换成：
      #   uses: actions/checkout@v4
      #   with: { repository: ${{ env.SDK_REPO }}, ref: ${{ env.SDK_REF }}, path: ../sdk, token: ${{ secrets.SDK_TOKEN }} }
      - name: 检出词典笔 SDK（放到仓库同级目录）
        run: |
          git clone --depth 1 --branch "${SDK_REF}" \
            "https://github.com/${SDK_REPO}.git" "${GITHUB_WORKSPACE}/../sdk"
          test -f "${GITHUB_WORKSPACE}/../sdk/packages/core/src/index.js"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # app/package.json 与 package-lock.json 提交的都是 Windows 绝对路径
      # （file:D:/codes/youdao/sdk/...），在 CI runner 上不存在。按 SDK 的
      # new-app.sh 约定统一成相对路径，与 node_modules/@dictpen/* 链接条目的
      # resolved 一致；仓库文件本身不动。package-lock.json 的 packages[""]
      # 根条目必须一起改写，否则 node 18 自带 npm 的 npm ci 可能报 lock 不同步。
      - name: 改写 @dictpen 依赖为相对路径
        working-directory: app
        run: |
          sed -i -E 's#"@dictpen/(core|types)": "file:[^"]*"#"@dictpen/\1": "file:../../sdk/packages/\1"#' package.json package-lock.json
          grep -q '"@dictpen/core": "file:../../sdk/packages/core"' package.json
          grep -q '"@dictpen/types": "file:../../sdk/packages/types"' package.json
          grep -q '"@dictpen/core": "file:../../sdk/packages/core"' package-lock.json
          grep -q '"@dictpen/types": "file:../../sdk/packages/types"' package-lock.json

      - name: 安装依赖（npm ci，postinstall 会打 aiot-vue-cli 补丁）
        working-directory: app
        run: npm ci

      # 纯函数回归用例（LaTeX / config.toml 解析 / markdown / emoji / 限流分类）。
      # build:prod 里 build-wrapper 也会再跑一遍，这里提前单跑是为了让失败
      # 信息直接落在测试步骤，而不是埋在十几分钟的打包日志里。
      - name: 纯函数回归测试
        working-directory: app
        run: npm test

      - name: 类型检查（@dictpen/types）
        working-directory: app
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: 放入后端二进制（build:prod 会把它内嵌进产物）
        uses: actions/download-artifact@v4
        with:
          name: ds-free-api-aarch64
          path: app/backend/linux-aarch64-gnu

      # aiot-qjsc-tool 自带的 Linux qjsc 是 ELF 可执行文件；若 npm 解包后丢了可执行位，
      # qjsc 预编译会 spawn 失败，这里兜底补上。
      - name: 确保 qjsc 可执行
        working-directory: app
        run: chmod +x node_modules/aiot-vue-cli/cli-libs/aiot-qjsc-tool/assets/bin/linux/qjsc* || true

      - name: 打包 AMR（build:prod 含 qjsc 预编译，约 15 分钟）
        working-directory: app
        run: npm run build:prod

      - name: 上传 AMR
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-miniapp-amr
          path: app/*.amr
          if-no-files-found: error
